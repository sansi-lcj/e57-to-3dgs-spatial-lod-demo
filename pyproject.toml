[project]
name = "e57-to-3dgs"
version = "0.1.0"
description = "Reproducible Realsee E57 to COLMAP and 3D Gaussian Splatting pipeline"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2.3,<3",
  "opencv-python-headless>=4.12,<5",
  "pillow>=11,<13",
  "pycolmap==4.1.1",
  "pye57==0.4.19",
]

[project.scripts]
e57gs = "e57gs.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e57gs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
